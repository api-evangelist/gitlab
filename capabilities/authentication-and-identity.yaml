naftiko: 1.0.0-alpha2
info:
  label: GitLab Authentication And Identity
  description: Unified capability for GitLab OAuth 2.0 authentication flows and user identity. Enables developers and platform
    administrators to manage OAuth application authorization, token lifecycle, and authenticated user profile retrieval.
  tags:
  - Gitlab
  - Authentication
  - OAuth
  - Identity
  - Tokens
  created: '2026-04-18'
  modified: '2026-05-06'
binds:
- namespace: env
  keys:
    GITLAB_OAUTH_TOKEN: GITLAB_OAUTH_TOKEN
    GITLAB_CLIENT_ID: GITLAB_CLIENT_ID
    GITLAB_CLIENT_SECRET: GITLAB_CLIENT_SECRET
capability:
  consumes:
  - type: http
    namespace: gitlab-oauth2
    baseUri: https://gitlab.com
    description: GitLab OAuth 2.0 API for authorization flows, token management, and user information.
    authentication:
      type: bearer
      token: '{{GITLAB_OAUTH_TOKEN}}'
    resources:
    - name: authorization
      path: /oauth
      description: OAuth 2.0 authorization endpoints for initiating auth flows.
      operations:
      - name: authorize-oauth
        method: GET
        description: Initiates the OAuth 2.0 authorization code flow. Redirects the user to the GitLab authorization page
          where they can grant access to the application.
        path: /authorize
        inputParameters:
        - name: client_id
          in: query
          type: string
          required: true
          description: The application ID registered in GitLab.
        - name: redirect_uri
          in: query
          type: string
          required: true
          description: The URI to redirect to after authorization.
        - name: response_type
          in: query
          type: string
          required: true
          description: Must be set to code for the authorization code flow.
        - name: state
          in: query
          type: string
          required: true
          description: A random, unguessable string used to protect against CSRF attacks.
        - name: scope
          in: query
          type: string
          required: false
          description: Space-separated list of scopes to request.
        - name: code_challenge
          in: query
          type: string
          required: false
          description: A Base64 URL-encoded SHA-256 hash of the code_verifier for PKCE.
        - name: code_challenge_method
          in: query
          type: string
          required: false
          description: The method used to generate the code_challenge. Must be S256.
        - name: root_namespace_id
          in: query
          type: integer
          required: false
          description: Limits group access token creation to a specific namespace.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: authorize-device
        method: POST
        description: Initiates the OAuth 2.0 device authorization grant flow for input-constrained devices.
        path: /authorize_device
        inputParameters: []
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        body:
          type: json
          data:
            client_id: '{{tools.client_id}}'
            scope: '{{tools.scope}}'
    - name: tokens
      path: /oauth
      description: OAuth 2.0 token management endpoints for exchanging, refreshing, and revoking tokens.
      operations:
      - name: exchange-token
        method: POST
        description: Exchanges an authorization code, device code, or refresh token for an OAuth 2.0 access token.
        path: /token
        inputParameters: []
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        body:
          type: json
          data:
            grant_type: '{{tools.grant_type}}'
            client_id: '{{tools.client_id}}'
            client_secret: '{{tools.client_secret}}'
            code: '{{tools.code}}'
            redirect_uri: '{{tools.redirect_uri}}'
            code_verifier: '{{tools.code_verifier}}'
            refresh_token: '{{tools.refresh_token}}'
            device_code: '{{tools.device_code}}'
            username: '{{tools.username}}'
            password: '{{tools.password}}'
      - name: revoke-token
        method: POST
        description: Revokes an existing OAuth access token or refresh token.
        path: /revoke
        inputParameters: []
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        body:
          type: json
          data:
            client_id: '{{tools.client_id}}'
            client_secret: '{{tools.client_secret}}'
            token: '{{tools.token}}'
      - name: get-token-info
        method: GET
        description: Returns information about the current OAuth access token, including scopes and expiration time.
        path: /token/info
        inputParameters: []
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: user-info
      path: /oauth
      description: OpenID Connect UserInfo endpoint for retrieving authenticated user profile information.
      operations:
      - name: get-user-info
        method: GET
        description: Returns profile information about the currently authenticated user based on the OAuth token's scopes.
        path: /userinfo
        inputParameters: []
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  exposes:
  - type: rest
    port: 8080
    namespace: gitlab-auth-api
    description: Unified REST API for GitLab OAuth 2.0 authentication and identity management.
    resources:
    - path: /v1/authorizations
      name: authorizations
      description: OAuth 2.0 authorization code flow initiation.
      operations:
      - method: GET
        name: authorize-oauth
        description: Initiate the OAuth 2.0 authorization code flow.
        call: gitlab-oauth2.authorize-oauth
        with:
          client_id: rest.client_id
          redirect_uri: rest.redirect_uri
          response_type: rest.response_type
          state: rest.state
          scope: rest.scope
          code_challenge: rest.code_challenge
          code_challenge_method: rest.code_challenge_method
          root_namespace_id: rest.root_namespace_id
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/device-authorizations
      name: device-authorizations
      description: Device authorization grant flow for input-constrained devices.
      operations:
      - method: POST
        name: authorize-device
        description: Initiate the device authorization grant flow.
        call: gitlab-oauth2.authorize-device
        with:
          client_id: rest.client_id
          scope: rest.scope
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/tokens
      name: tokens
      description: OAuth token exchange and creation.
      operations:
      - method: POST
        name: exchange-token
        description: Exchange an authorization code, device code, or refresh token for an access token.
        call: gitlab-oauth2.exchange-token
        with:
          grant_type: rest.grant_type
          client_id: rest.client_id
          client_secret: rest.client_secret
          code: rest.code
          redirect_uri: rest.redirect_uri
          code_verifier: rest.code_verifier
          refresh_token: rest.refresh_token
          device_code: rest.device_code
          username: rest.username
          password: rest.password
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/token-revocations
      name: token-revocations
      description: Token revocation.
      operations:
      - method: POST
        name: revoke-token
        description: Revoke an OAuth access or refresh token.
        call: gitlab-oauth2.revoke-token
        with:
          client_id: rest.client_id
          client_secret: rest.client_secret
          token: rest.token
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/token-info
      name: token-info
      description: Token introspection and validation.
      operations:
      - method: GET
        name: get-token-info
        description: Get information about the current access token.
        call: gitlab-oauth2.get-token-info
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/user-info
      name: user-info
      description: Authenticated user profile information.
      operations:
      - method: GET
        name: get-user-info
        description: Get profile information about the authenticated user.
        call: gitlab-oauth2.get-user-info
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    port: 9090
    namespace: gitlab-auth-mcp
    transport: http
    description: MCP server for AI-assisted GitLab OAuth 2.0 authentication and identity management.
    tools:
    - name: authorize-oauth
      description: Initiate the OAuth 2.0 authorization code flow with optional PKCE support.
      hints:
        readOnly: true
        openWorld: true
        idempotent: true
      call: gitlab-oauth2.authorize-oauth
      with:
        client_id: tools.client_id
        redirect_uri: tools.redirect_uri
        response_type: tools.response_type
        state: tools.state
        scope: tools.scope
        code_challenge: tools.code_challenge
        code_challenge_method: tools.code_challenge_method
        root_namespace_id: tools.root_namespace_id
      outputParameters:
      - type: object
        mapping: $.
    - name: authorize-device
      description: Initiate the device authorization grant flow for input-constrained devices.
      hints:
        readOnly: false
        openWorld: true
        idempotent: false
      call: gitlab-oauth2.authorize-device
      with:
        client_id: tools.client_id
        scope: tools.scope
      outputParameters:
      - type: object
        mapping: $.
    - name: exchange-token
      description: Exchange an authorization code, device code, or refresh token for an access token.
      hints:
        readOnly: false
        openWorld: true
        idempotent: false
      call: gitlab-oauth2.exchange-token
      with:
        grant_type: tools.grant_type
        client_id: tools.client_id
        client_secret: tools.client_secret
        code: tools.code
        redirect_uri: tools.redirect_uri
        code_verifier: tools.code_verifier
        refresh_token: tools.refresh_token
        device_code: tools.device_code
        username: tools.username
        password: tools.password
      outputParameters:
      - type: object
        mapping: $.
    - name: revoke-token
      description: Revoke an existing OAuth access or refresh token.
      hints:
        readOnly: false
        destructive: true
        openWorld: true
        idempotent: true
      call: gitlab-oauth2.revoke-token
      with:
        client_id: tools.client_id
        client_secret: tools.client_secret
        token: tools.token
      outputParameters:
      - type: object
        mapping: $.
    - name: get-token-info
      description: Get information about the current OAuth access token including scopes and expiration.
      hints:
        readOnly: true
        openWorld: true
        idempotent: true
      call: gitlab-oauth2.get-token-info
      outputParameters:
      - type: object
        mapping: $.
    - name: get-user-info
      description: Get profile information about the currently authenticated user.
      hints:
        readOnly: true
        openWorld: true
        idempotent: true
      call: gitlab-oauth2.get-user-info
      outputParameters:
      - type: object
        mapping: $.
