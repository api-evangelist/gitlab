naftiko: 1.0.0-alpha2
info:
  label: GitLab API — Broadcast Messages
  description: 'GitLab API — Broadcast Messages. 5 operations. Lead operation: GitLab Get All Broadcast Messages. Self-contained
    Naftiko capability covering one Gitlab business surface.'
  tags:
  - Gitlab
  - Broadcast Messages
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    GITLAB_API_KEY: GITLAB_API_KEY
capability:
  consumes:
  - type: http
    namespace: gitlab-broadcast-messages
    baseUri: https://www.gitlab.com/api
    description: GitLab API — Broadcast Messages business capability. Self-contained, no shared references.
    resources:
    - name: api-v4-broadcast_messages
      path: /api/v4/broadcast_messages
      operations:
      - name: getapiv4broadcastmessages
        method: GET
        description: GitLab Get All Broadcast Messages
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: page
          in: query
          type: integer
          description: Current page number
        - name: per_page
          in: query
          type: integer
          description: Number of items per page
      - name: postapiv4broadcastmessages
        method: POST
        description: GitLab Create a Broadcast Message
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: api-v4-broadcast_messages-id
      path: /api/v4/broadcast_messages/{id}
      operations:
      - name: getapiv4broadcastmessagesid
        method: GET
        description: GitLab Get a Specific Broadcast Message
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: id
          in: path
          type: integer
          description: Broadcast message ID
          required: true
      - name: putapiv4broadcastmessagesid
        method: PUT
        description: GitLab Update a Broadcast Message
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: id
          in: path
          type: integer
          description: Broadcast message ID
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: false
      - name: deleteapiv4broadcastmessagesid
        method: DELETE
        description: GitLab Delete a Broadcast Message
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: id
          in: path
          type: integer
          description: Broadcast message ID
          required: true
    authentication:
      type: apikey
      key: Private-Token
      value: '{{env.GITLAB_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: gitlab-broadcast-messages-rest
    port: 8080
    description: REST adapter for GitLab API — Broadcast Messages. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/api/v4/broadcast-messages
      name: api-v4-broadcast-messages
      description: REST surface for api-v4-broadcast_messages.
      operations:
      - method: GET
        name: getapiv4broadcastmessages
        description: GitLab Get All Broadcast Messages
        call: gitlab-broadcast-messages.getapiv4broadcastmessages
        with:
          page: rest.page
          per_page: rest.per_page
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: postapiv4broadcastmessages
        description: GitLab Create a Broadcast Message
        call: gitlab-broadcast-messages.postapiv4broadcastmessages
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/api/v4/broadcast-messages/{id}
      name: api-v4-broadcast-messages-id
      description: REST surface for api-v4-broadcast_messages-id.
      operations:
      - method: GET
        name: getapiv4broadcastmessagesid
        description: GitLab Get a Specific Broadcast Message
        call: gitlab-broadcast-messages.getapiv4broadcastmessagesid
        with:
          id: rest.id
        outputParameters:
        - type: object
          mapping: $.
      - method: PUT
        name: putapiv4broadcastmessagesid
        description: GitLab Update a Broadcast Message
        call: gitlab-broadcast-messages.putapiv4broadcastmessagesid
        with:
          id: rest.id
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
      - method: DELETE
        name: deleteapiv4broadcastmessagesid
        description: GitLab Delete a Broadcast Message
        call: gitlab-broadcast-messages.deleteapiv4broadcastmessagesid
        with:
          id: rest.id
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: gitlab-broadcast-messages-mcp
    port: 9090
    transport: http
    description: MCP adapter for GitLab API — Broadcast Messages. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: gitlab-get-all-broadcast-messages
      description: GitLab Get All Broadcast Messages
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: gitlab-broadcast-messages.getapiv4broadcastmessages
      with:
        page: tools.page
        per_page: tools.per_page
      outputParameters:
      - type: object
        mapping: $.
    - name: gitlab-create-broadcast-message
      description: GitLab Create a Broadcast Message
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: gitlab-broadcast-messages.postapiv4broadcastmessages
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: gitlab-get-specific-broadcast-message
      description: GitLab Get a Specific Broadcast Message
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: gitlab-broadcast-messages.getapiv4broadcastmessagesid
      with:
        id: tools.id
      outputParameters:
      - type: object
        mapping: $.
    - name: gitlab-update-broadcast-message
      description: GitLab Update a Broadcast Message
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: gitlab-broadcast-messages.putapiv4broadcastmessagesid
      with:
        id: tools.id
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: gitlab-delete-broadcast-message
      description: GitLab Delete a Broadcast Message
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: gitlab-broadcast-messages.deleteapiv4broadcastmessagesid
      with:
        id: tools.id
      outputParameters:
      - type: object
        mapping: $.
