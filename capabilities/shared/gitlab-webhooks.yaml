naftiko: "1.0.0-alpha1"

info:
  label: "GitLab Webhooks"
  description: "The GitLab Webhooks API provides REST endpoints for managing project and group webhooks. Webhooks can be configured to send HTTP POST requests to external URLs when events occur in GitLab."
  tags:
    - Gitlab
    - Webhooks
    - Integrations
    - Devops
  created: "2026-04-18"
  modified: "2026-04-18"

binds:
  - namespace: env
    keys:
      GITLAB_PRIVATE_TOKEN: GITLAB_PRIVATE_TOKEN

capability:
  consumes:
    - type: http
      namespace: gitlab-webhooks
      baseUri: https://gitlab.com/api/v4
      description: "GitLab Webhooks API for managing project webhooks, custom headers, URL variables, and event history."
      authentication:
        type: apikey
        key: PRIVATE-TOKEN
        value: "{{GITLAB_PRIVATE_TOKEN}}"
        placement: header
      resources:
        - name: project-webhooks
          path: /projects/{id}/hooks
          description: "CRUD operations for project webhooks."
          operations:
            - name: list-project-webhooks
              method: GET
              description: "Returns a list of all webhooks configured for the specified project."
              inputParameters:
                - name: id
                  in: path
                  type: string
                  required: true
                  description: "The ID or URL-encoded path of the project."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

            - name: add-project-webhook
              method: POST
              description: "Creates a new webhook for the specified project."
              inputParameters:
                - name: id
                  in: path
                  type: string
                  required: true
                  description: "The ID or URL-encoded path of the project."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  url: "{{tools.url}}"
                  name: "{{tools.name}}"
                  description: "{{tools.description}}"
                  secret_token: "{{tools.secret_token}}"
                  enable_ssl_verification: "{{tools.enable_ssl_verification}}"
                  push_events: "{{tools.push_events}}"
                  tag_push_events: "{{tools.tag_push_events}}"
                  issues_events: "{{tools.issues_events}}"
                  confidential_issues_events: "{{tools.confidential_issues_events}}"
                  merge_requests_events: "{{tools.merge_requests_events}}"
                  note_events: "{{tools.note_events}}"
                  confidential_note_events: "{{tools.confidential_note_events}}"
                  job_events: "{{tools.job_events}}"
                  pipeline_events: "{{tools.pipeline_events}}"
                  wiki_page_events: "{{tools.wiki_page_events}}"
                  deployment_events: "{{tools.deployment_events}}"
                  releases_events: "{{tools.releases_events}}"
                  member_events: "{{tools.member_events}}"
                  push_events_branch_filter: "{{tools.push_events_branch_filter}}"

        - name: project-webhook-detail
          path: /projects/{id}/hooks/{hook_id}
          description: "Get, update, or delete a specific project webhook."
          operations:
            - name: get-project-webhook
              method: GET
              description: "Returns configuration details for a specific webhook in a project."
              inputParameters:
                - name: id
                  in: path
                  type: string
                  required: true
                  description: "The ID or URL-encoded path of the project."
                - name: hook_id
                  in: path
                  type: integer
                  required: true
                  description: "The ID of the webhook."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

            - name: update-project-webhook
              method: PUT
              description: "Modifies the configuration of an existing project webhook."
              inputParameters:
                - name: id
                  in: path
                  type: string
                  required: true
                  description: "The ID or URL-encoded path of the project."
                - name: hook_id
                  in: path
                  type: integer
                  required: true
                  description: "The ID of the webhook."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  url: "{{tools.url}}"
                  name: "{{tools.name}}"
                  description: "{{tools.description}}"
                  secret_token: "{{tools.secret_token}}"
                  enable_ssl_verification: "{{tools.enable_ssl_verification}}"
                  push_events: "{{tools.push_events}}"
                  tag_push_events: "{{tools.tag_push_events}}"
                  issues_events: "{{tools.issues_events}}"
                  confidential_issues_events: "{{tools.confidential_issues_events}}"
                  merge_requests_events: "{{tools.merge_requests_events}}"
                  note_events: "{{tools.note_events}}"
                  confidential_note_events: "{{tools.confidential_note_events}}"
                  job_events: "{{tools.job_events}}"
                  pipeline_events: "{{tools.pipeline_events}}"
                  wiki_page_events: "{{tools.wiki_page_events}}"
                  deployment_events: "{{tools.deployment_events}}"
                  releases_events: "{{tools.releases_events}}"
                  member_events: "{{tools.member_events}}"
                  push_events_branch_filter: "{{tools.push_events_branch_filter}}"

            - name: delete-project-webhook
              method: DELETE
              description: "Removes a webhook from the specified project."
              inputParameters:
                - name: id
                  in: path
                  type: string
                  required: true
                  description: "The ID or URL-encoded path of the project."
                - name: hook_id
                  in: path
                  type: integer
                  required: true
                  description: "The ID of the webhook."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: webhook-events
          path: /projects/{id}/hooks/{hook_id}/events
          description: "Webhook delivery history and event resending."
          operations:
            - name: list-webhook-events
              method: GET
              description: "Returns a list of all delivery events for a specified project webhook from the past 7 days."
              inputParameters:
                - name: id
                  in: path
                  type: string
                  required: true
                  description: "The ID or URL-encoded path of the project."
                - name: hook_id
                  in: path
                  type: integer
                  required: true
                  description: "The ID of the webhook."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

            - name: resend-webhook-event
              method: POST
              description: "Resends a previously triggered webhook event to the configured URL."
              path: /{hook_event_id}/resend
              inputParameters:
                - name: id
                  in: path
                  type: string
                  required: true
                  description: "The ID or URL-encoded path of the project."
                - name: hook_id
                  in: path
                  type: integer
                  required: true
                  description: "The ID of the webhook."
                - name: hook_event_id
                  in: path
                  type: integer
                  required: true
                  description: "The ID of the webhook event to resend."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: webhook-testing
          path: /projects/{id}/hooks/{hook_id}/test
          description: "Test webhook triggers."
          operations:
            - name: test-project-webhook
              method: POST
              description: "Sends a test webhook payload of the specified trigger type to the configured webhook URL."
              path: /{trigger}
              inputParameters:
                - name: id
                  in: path
                  type: string
                  required: true
                  description: "The ID or URL-encoded path of the project."
                - name: hook_id
                  in: path
                  type: integer
                  required: true
                  description: "The ID of the webhook."
                - name: trigger
                  in: path
                  type: string
                  required: true
                  description: "The event type to simulate (e.g., push_events, merge_requests_events, pipeline_events)."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: webhook-custom-headers
          path: /projects/{id}/hooks/{hook_id}/custom_headers/{key}
          description: "Manage custom HTTP headers for webhook deliveries."
          operations:
            - name: set-webhook-custom-header
              method: PUT
              description: "Adds or updates a custom HTTP header sent with every webhook delivery."
              inputParameters:
                - name: id
                  in: path
                  type: string
                  required: true
                  description: "The ID or URL-encoded path of the project."
                - name: hook_id
                  in: path
                  type: integer
                  required: true
                  description: "The ID of the webhook."
                - name: key
                  in: path
                  type: string
                  required: true
                  description: "The name of the custom header."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  value: "{{tools.value}}"

            - name: delete-webhook-custom-header
              method: DELETE
              description: "Removes a custom HTTP header from the specified webhook."
              inputParameters:
                - name: id
                  in: path
                  type: string
                  required: true
                  description: "The ID or URL-encoded path of the project."
                - name: hook_id
                  in: path
                  type: integer
                  required: true
                  description: "The ID of the webhook."
                - name: key
                  in: path
                  type: string
                  required: true
                  description: "The name of the custom header to delete."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: webhook-url-variables
          path: /projects/{id}/hooks/{hook_id}/url_variables/{key}
          description: "Manage URL variables for dynamic webhook URL substitution."
          operations:
            - name: set-webhook-url-variable
              method: PUT
              description: "Adds or updates a URL variable for the specified webhook."
              inputParameters:
                - name: id
                  in: path
                  type: string
                  required: true
                  description: "The ID or URL-encoded path of the project."
                - name: hook_id
                  in: path
                  type: integer
                  required: true
                  description: "The ID of the webhook."
                - name: key
                  in: path
                  type: string
                  required: true
                  description: "The name of the URL variable."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  value: "{{tools.value}}"

            - name: delete-webhook-url-variable
              method: DELETE
              description: "Removes a URL variable from the specified webhook."
              inputParameters:
                - name: id
                  in: path
                  type: string
                  required: true
                  description: "The ID or URL-encoded path of the project."
                - name: hook_id
                  in: path
                  type: integer
                  required: true
                  description: "The ID of the webhook."
                - name: key
                  in: path
                  type: string
                  required: true
                  description: "The name of the URL variable to delete."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

  exposes:
    - type: rest
      port: 8101
      namespace: gitlab-webhooks-api
      resources:
        - path: /v1/projects/{id}/webhooks
          name: project-webhooks
          description: "Project webhook management."
          operations:
            - method: GET
              name: list-project-webhooks
              description: "List all webhooks for a project."
              call: "gitlab-webhooks.list-project-webhooks"
              with:
                id: "rest.id"
              outputParameters:
                - type: object
                  mapping: "$."
            - method: POST
              name: add-project-webhook
              description: "Add a new webhook to a project."
              call: "gitlab-webhooks.add-project-webhook"
              with:
                id: "rest.id"
                url: "rest.url"
                name: "rest.name"
                description: "rest.description"
                secret_token: "rest.secret_token"
                enable_ssl_verification: "rest.enable_ssl_verification"
                push_events: "rest.push_events"
                tag_push_events: "rest.tag_push_events"
                issues_events: "rest.issues_events"
                merge_requests_events: "rest.merge_requests_events"
                note_events: "rest.note_events"
                job_events: "rest.job_events"
                pipeline_events: "rest.pipeline_events"
                wiki_page_events: "rest.wiki_page_events"
                deployment_events: "rest.deployment_events"
                releases_events: "rest.releases_events"
                member_events: "rest.member_events"
              outputParameters:
                - type: object
                  mapping: "$."

        - path: /v1/projects/{id}/webhooks/{hook_id}
          name: project-webhook-detail
          description: "Individual webhook operations."
          operations:
            - method: GET
              name: get-project-webhook
              description: "Get details of a specific project webhook."
              call: "gitlab-webhooks.get-project-webhook"
              with:
                id: "rest.id"
                hook_id: "rest.hook_id"
              outputParameters:
                - type: object
                  mapping: "$."
            - method: PUT
              name: update-project-webhook
              description: "Update a project webhook configuration."
              call: "gitlab-webhooks.update-project-webhook"
              with:
                id: "rest.id"
                hook_id: "rest.hook_id"
                url: "rest.url"
                name: "rest.name"
                description: "rest.description"
                secret_token: "rest.secret_token"
                enable_ssl_verification: "rest.enable_ssl_verification"
                push_events: "rest.push_events"
                tag_push_events: "rest.tag_push_events"
                issues_events: "rest.issues_events"
                merge_requests_events: "rest.merge_requests_events"
                note_events: "rest.note_events"
                job_events: "rest.job_events"
                pipeline_events: "rest.pipeline_events"
                wiki_page_events: "rest.wiki_page_events"
                deployment_events: "rest.deployment_events"
                releases_events: "rest.releases_events"
                member_events: "rest.member_events"
              outputParameters:
                - type: object
                  mapping: "$."
            - method: DELETE
              name: delete-project-webhook
              description: "Delete a project webhook."
              call: "gitlab-webhooks.delete-project-webhook"
              with:
                id: "rest.id"
                hook_id: "rest.hook_id"
              outputParameters:
                - type: object
                  mapping: "$."

        - path: /v1/projects/{id}/webhooks/{hook_id}/events
          name: webhook-events
          description: "Webhook delivery event history."
          operations:
            - method: GET
              name: list-webhook-events
              description: "List delivery events for a webhook."
              call: "gitlab-webhooks.list-webhook-events"
              with:
                id: "rest.id"
                hook_id: "rest.hook_id"
              outputParameters:
                - type: object
                  mapping: "$."

        - path: /v1/projects/{id}/webhooks/{hook_id}/events/{hook_event_id}/resend
          name: webhook-event-resend
          description: "Resend a webhook event."
          operations:
            - method: POST
              name: resend-webhook-event
              description: "Resend a previously triggered webhook event."
              call: "gitlab-webhooks.resend-webhook-event"
              with:
                id: "rest.id"
                hook_id: "rest.hook_id"
                hook_event_id: "rest.hook_event_id"
              outputParameters:
                - type: object
                  mapping: "$."

        - path: /v1/projects/{id}/webhooks/{hook_id}/tests/{trigger}
          name: webhook-test
          description: "Test webhook triggers."
          operations:
            - method: POST
              name: test-project-webhook
              description: "Send a test webhook payload."
              call: "gitlab-webhooks.test-project-webhook"
              with:
                id: "rest.id"
                hook_id: "rest.hook_id"
                trigger: "rest.trigger"
              outputParameters:
                - type: object
                  mapping: "$."

        - path: /v1/projects/{id}/webhooks/{hook_id}/custom-headers/{key}
          name: webhook-custom-headers
          description: "Custom header management for webhooks."
          operations:
            - method: PUT
              name: set-webhook-custom-header
              description: "Set a custom header for a webhook."
              call: "gitlab-webhooks.set-webhook-custom-header"
              with:
                id: "rest.id"
                hook_id: "rest.hook_id"
                key: "rest.key"
                value: "rest.value"
              outputParameters:
                - type: object
                  mapping: "$."
            - method: DELETE
              name: delete-webhook-custom-header
              description: "Delete a custom header from a webhook."
              call: "gitlab-webhooks.delete-webhook-custom-header"
              with:
                id: "rest.id"
                hook_id: "rest.hook_id"
                key: "rest.key"
              outputParameters:
                - type: object
                  mapping: "$."

        - path: /v1/projects/{id}/webhooks/{hook_id}/url-variables/{key}
          name: webhook-url-variables
          description: "URL variable management for webhooks."
          operations:
            - method: PUT
              name: set-webhook-url-variable
              description: "Set a URL variable for a webhook."
              call: "gitlab-webhooks.set-webhook-url-variable"
              with:
                id: "rest.id"
                hook_id: "rest.hook_id"
                key: "rest.key"
                value: "rest.value"
              outputParameters:
                - type: object
                  mapping: "$."
            - method: DELETE
              name: delete-webhook-url-variable
              description: "Delete a URL variable from a webhook."
              call: "gitlab-webhooks.delete-webhook-url-variable"
              with:
                id: "rest.id"
                hook_id: "rest.hook_id"
                key: "rest.key"
              outputParameters:
                - type: object
                  mapping: "$."

    - type: mcp
      port: 9101
      namespace: gitlab-webhooks-mcp
      transport: http
      tools:
        - name: list-project-webhooks
          description: "List all webhooks configured for a project."
          hints:
            readOnly: true
            openWorld: true
            idempotent: true
          call: "gitlab-webhooks.list-project-webhooks"
          with:
            id: "tools.id"
          outputParameters:
            - type: object
              mapping: "$."

        - name: add-project-webhook
          description: "Create a new webhook for a project."
          hints:
            readOnly: false
            openWorld: true
            idempotent: false
          call: "gitlab-webhooks.add-project-webhook"
          with:
            id: "tools.id"
            url: "tools.url"
            name: "tools.name"
            description: "tools.description"
            secret_token: "tools.secret_token"
            enable_ssl_verification: "tools.enable_ssl_verification"
            push_events: "tools.push_events"
            tag_push_events: "tools.tag_push_events"
            issues_events: "tools.issues_events"
            confidential_issues_events: "tools.confidential_issues_events"
            merge_requests_events: "tools.merge_requests_events"
            note_events: "tools.note_events"
            confidential_note_events: "tools.confidential_note_events"
            job_events: "tools.job_events"
            pipeline_events: "tools.pipeline_events"
            wiki_page_events: "tools.wiki_page_events"
            deployment_events: "tools.deployment_events"
            releases_events: "tools.releases_events"
            member_events: "tools.member_events"
            push_events_branch_filter: "tools.push_events_branch_filter"
          outputParameters:
            - type: object
              mapping: "$."

        - name: get-project-webhook
          description: "Get configuration details for a specific project webhook."
          hints:
            readOnly: true
            openWorld: true
            idempotent: true
          call: "gitlab-webhooks.get-project-webhook"
          with:
            id: "tools.id"
            hook_id: "tools.hook_id"
          outputParameters:
            - type: object
              mapping: "$."

        - name: update-project-webhook
          description: "Update the configuration of an existing project webhook."
          hints:
            readOnly: false
            openWorld: true
            idempotent: true
          call: "gitlab-webhooks.update-project-webhook"
          with:
            id: "tools.id"
            hook_id: "tools.hook_id"
            url: "tools.url"
            name: "tools.name"
            description: "tools.description"
            secret_token: "tools.secret_token"
            enable_ssl_verification: "tools.enable_ssl_verification"
            push_events: "tools.push_events"
            tag_push_events: "tools.tag_push_events"
            issues_events: "tools.issues_events"
            confidential_issues_events: "tools.confidential_issues_events"
            merge_requests_events: "tools.merge_requests_events"
            note_events: "tools.note_events"
            confidential_note_events: "tools.confidential_note_events"
            job_events: "tools.job_events"
            pipeline_events: "tools.pipeline_events"
            wiki_page_events: "tools.wiki_page_events"
            deployment_events: "tools.deployment_events"
            releases_events: "tools.releases_events"
            member_events: "tools.member_events"
            push_events_branch_filter: "tools.push_events_branch_filter"
          outputParameters:
            - type: object
              mapping: "$."

        - name: delete-project-webhook
          description: "Remove a webhook from a project."
          hints:
            readOnly: false
            destructive: true
            openWorld: true
            idempotent: true
          call: "gitlab-webhooks.delete-project-webhook"
          with:
            id: "tools.id"
            hook_id: "tools.hook_id"
          outputParameters:
            - type: object
              mapping: "$."

        - name: list-webhook-events
          description: "List delivery events for a webhook from the past 7 days."
          hints:
            readOnly: true
            openWorld: true
            idempotent: true
          call: "gitlab-webhooks.list-webhook-events"
          with:
            id: "tools.id"
            hook_id: "tools.hook_id"
          outputParameters:
            - type: object
              mapping: "$."

        - name: resend-webhook-event
          description: "Resend a previously triggered webhook event."
          hints:
            readOnly: false
            openWorld: true
            idempotent: false
          call: "gitlab-webhooks.resend-webhook-event"
          with:
            id: "tools.id"
            hook_id: "tools.hook_id"
            hook_event_id: "tools.hook_event_id"
          outputParameters:
            - type: object
              mapping: "$."

        - name: test-project-webhook
          description: "Send a test webhook payload of a specified trigger type."
          hints:
            readOnly: false
            openWorld: true
            idempotent: false
          call: "gitlab-webhooks.test-project-webhook"
          with:
            id: "tools.id"
            hook_id: "tools.hook_id"
            trigger: "tools.trigger"
          outputParameters:
            - type: object
              mapping: "$."

        - name: set-webhook-custom-header
          description: "Add or update a custom HTTP header for webhook deliveries."
          hints:
            readOnly: false
            openWorld: true
            idempotent: true
          call: "gitlab-webhooks.set-webhook-custom-header"
          with:
            id: "tools.id"
            hook_id: "tools.hook_id"
            key: "tools.key"
            value: "tools.value"
          outputParameters:
            - type: object
              mapping: "$."

        - name: delete-webhook-custom-header
          description: "Remove a custom HTTP header from a webhook."
          hints:
            readOnly: false
            destructive: true
            openWorld: true
            idempotent: true
          call: "gitlab-webhooks.delete-webhook-custom-header"
          with:
            id: "tools.id"
            hook_id: "tools.hook_id"
            key: "tools.key"
          outputParameters:
            - type: object
              mapping: "$."

        - name: set-webhook-url-variable
          description: "Add or update a URL variable for dynamic webhook URL substitution."
          hints:
            readOnly: false
            openWorld: true
            idempotent: true
          call: "gitlab-webhooks.set-webhook-url-variable"
          with:
            id: "tools.id"
            hook_id: "tools.hook_id"
            key: "tools.key"
            value: "tools.value"
          outputParameters:
            - type: object
              mapping: "$."

        - name: delete-webhook-url-variable
          description: "Remove a URL variable from a webhook."
          hints:
            readOnly: false
            destructive: true
            openWorld: true
            idempotent: true
          call: "gitlab-webhooks.delete-webhook-url-variable"
          with:
            id: "tools.id"
            hook_id: "tools.hook_id"
            key: "tools.key"
          outputParameters:
            - type: object
              mapping: "$."
