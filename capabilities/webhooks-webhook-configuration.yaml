          in: path
          type: string
          description: The name of the custom header to delete.
          required: true
    - name: projects-id-hooks-hook_id-url_variables-key
      path: /projects/{id}/hooks/{hook_id}/url_variables/{key}
      operations:
      - name: setwebhookurlvariable
        method: PUT
