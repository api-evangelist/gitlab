        description: GitLab Delete a Webhook URL Variable
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: key
          in: path
          type: string
          description: The name of the URL variable to delete.
          required: true
    authentication:
      type: bearer
      token: '{{env.GITLAB_API_KEY}}'
  exposes:
