naftiko: 1.0.0-alpha2
info:
  label: GitLab API — Applications
  description: 'GitLab API — Applications. 3 operations. Lead operation: GitLab Get Applications. Self-contained Naftiko capability
    covering one Gitlab business surface.'
  tags:
  - Gitlab
  - Applications
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    GITLAB_API_KEY: GITLAB_API_KEY
capability:
  consumes:
  - type: http
    namespace: gitlab-applications
    baseUri: https://www.gitlab.com/api
    description: GitLab API — Applications business capability. Self-contained, no shared references.
    resources:
    - name: api-v4-applications
      path: /api/v4/applications
      operations:
      - name: getapiv4applications
        method: GET
        description: GitLab Get Applications
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: postapiv4applications
        method: POST
        description: GitLab Create a New Application
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: api-v4-applications-id
      path: /api/v4/applications/{id}
      operations:
      - name: deleteapiv4applicationsid
        method: DELETE
        description: GitLab Delete an Application
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: id
          in: path
          type: integer
          description: The ID of the application (not the application_id)
          required: true
    authentication:
      type: apikey
      key: Private-Token
      value: '{{env.GITLAB_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: gitlab-applications-rest
    port: 8080
    description: REST adapter for GitLab API — Applications. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/api/v4/applications
      name: api-v4-applications
      description: REST surface for api-v4-applications.
      operations:
      - method: GET
        name: getapiv4applications
        description: GitLab Get Applications
        call: gitlab-applications.getapiv4applications
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: postapiv4applications
        description: GitLab Create a New Application
        call: gitlab-applications.postapiv4applications
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/api/v4/applications/{id}
      name: api-v4-applications-id
      description: REST surface for api-v4-applications-id.
      operations:
      - method: DELETE
        name: deleteapiv4applicationsid
        description: GitLab Delete an Application
        call: gitlab-applications.deleteapiv4applicationsid
        with:
          id: rest.id
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: gitlab-applications-mcp
    port: 9090
    transport: http
    description: MCP adapter for GitLab API — Applications. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: gitlab-get-applications
      description: GitLab Get Applications
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: gitlab-applications.getapiv4applications
      outputParameters:
      - type: object
        mapping: $.
    - name: gitlab-create-new-application
      description: GitLab Create a New Application
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: gitlab-applications.postapiv4applications
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: gitlab-delete-application
      description: GitLab Delete an Application
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: gitlab-applications.deleteapiv4applicationsid
      with:
        id: tools.id
      outputParameters:
      - type: object
        mapping: $.
