generated: '2026-06-20'
method: searched
status: published
source: https://docs.gitlab.com/user/gitlab_duo/model_context_protocol/mcp_server/
server:
  name: gitlab
  transport: http
  url: https://gitlab.com/api/v4/mcp
  self_managed_url: https://<gitlab.example.com>/api/v4/mcp
  auth:
    type: oauth2
    dynamic_client_registration: true
    registration_endpoint: https://gitlab.com/oauth/register
    notes: >-
      The GitLab MCP server supports OAuth 2.0 Dynamic Client Registration (RFC 7591);
      MCP clients register themselves as an OAuth application on first connect. Personal
      access tokens are also supported.
  stdio_bridge: "npx -y mcp-remote@latest https://gitlab.com/api/v4/mcp"
availability:
  introduced: '18.3'
  status_track: Beta
  beta_since: '18.6'
  notes: >-
    Introduced as an experiment in GitLab 18.3, promoted to Beta in 18.6. Available on
    GitLab.com, GitLab Dedicated, and Self-Managed. Discoverable/governable via the
    GitLab AI Catalog. Requires the `mcp` OAuth scope.
clients_supported:
- Claude Desktop
- Claude Code
- Cursor
- other MCP-compatible tools
docs:
- https://docs.gitlab.com/user/gitlab_duo/model_context_protocol/
- https://docs.gitlab.com/user/gitlab_duo/model_context_protocol/mcp_clients/
