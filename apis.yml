description: >-
  GitLab Inc. is an open-core company that develops GitLab, a DevOps software platform for building, securing, and
  managing applications. Created by Ukrainian developer Dmytro Zaporozhets and Dutch developer Sytse Sijbrandij, GitLab
  became the first partly-Ukrainian unicorn in 2018. Known for promoting remote work, it is one of the largest
  all-remote companies globally. GitLab has approximately 30 million registered users, including 1 million active
  licensed users.
