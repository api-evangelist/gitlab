- aid: gitlab:gitlab-graphql-api
  name: GitLab GraphQL API
  tags:
  - Data
  - GraphQL
  - Query Language
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  baseURL: https://gitlab.com/api/graphql
  humanURL: https://docs.gitlab.com/ee/api/graphql/
  overlays: []
  properties:
  - url: https://docs.gitlab.com/ee/api/graphql/
    type: Documentation
  - url: https://docs.gitlab.com/ee/api/graphql/#deprecation-and-removal-process
    type: Deprecation
  - url: https://docs.gitlab.com/ee/api/graphql/#deprecation-and-removal-process
    type: Documentation
  - url: https://docs.gitlab.com/ee/api/graphql/#limits
    type: RateLimits
  - url: https://docs.gitlab.com/api/rest/authentication/
    type: Authentication
  - url: https://docs.gitlab.com/api/graphql/reference/
    type: APIReference
  - url: https://docs.gitlab.com/api/graphql/getting_started/
    type: GettingStarted
  - url: graphql/gitlab-graphql.md
    type: GraphQL
  description: >-
    GraphQL is a query language for APIs. You can use it to request the exact data you need, and therefore
    limit the number of requests you need. GraphQL data is arranged in types, so your client can use client-side
    GraphQL libraries to consume the API and avoid manual parsing. There are no fixed endpoints and no
    data model, so you can add to the API without creating breaking changes. This enables us to have a
    versionless API.
