specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: GitLab
providerId: gitlab
created: '2026-05-04'
modified: '2026-05-04'
reconciled: true
tags:
  - DevOps
  - Source Control
  - CI/CD
description: 'GitLab.com plans: Free / Premium / Ultimate.'
sources:
  - https://about.gitlab.com/pricing/
plans:
  - id: gitlab-free
    name: Free
    type: freemium
    description: 5 licensed users, 400 compute minutes/mo, 10 GiB storage.
    entries:
      - label: Licensed users
        name: users
        type: quota
        metric: user
        limit: 5
        timeFrame: month
        geo: global
        unit: 1
        price: '0.00'
        userMultiplied: false
      - label: Compute minutes
        name: minutes
        type: quota
        metric: minute
        limit: 400
        timeFrame: month
        geo: global
        unit: 1
        price: '0.00'
        userMultiplied: false
      - label: Storage
        name: storage
        type: quota
        metric: GiB
        limit: 10
        timeFrame: month
        geo: global
        unit: 1
        price: '0.00'
        userMultiplied: false
    elements:
      - name: Source code management + CI/CD
      - name: Built-in CI/CD
      - name: Container Scanning
  - id: gitlab-premium
    name: Premium
    type: paid
    description: $29/user/month.
    entries:
      - label: Per user
        name: seat
        type: subscription
        metric: user
        limit: -1
        timeFrame: month
        geo: global
        unit: 1
        price: '29.00'
        userMultiplied: true
      - label: Compute minutes
        name: minutes
        type: quota
        metric: minute
        limit: 10000
        timeFrame: month
        geo: global
        unit: 1
        price: '0.00'
        userMultiplied: false
      - label: GitLab Credits included
        name: credits
        type: quota
        metric: USD
        limit: 12
        timeFrame: month
        geo: global
        unit: 1
        price: '0.00'
        userMultiplied: false
    elements:
      - name: Unlimited licensed users
      - name: Advanced CI/CD
      - name: Team Project Management
      - name: SLA Management
      - name: Priority Support
  - id: gitlab-ultimate
    name: Ultimate
    type: enterprise
    description: Custom pricing.
    entries:
      - label: Per user (custom)
        name: seat
        type: subscription
        metric: user
        limit: -1
        timeFrame: month
        geo: global
        unit: 1
        price: custom
        userMultiplied: true
      - label: Compute minutes
        name: minutes
        type: quota
        metric: minute
        limit: 50000
        timeFrame: month
        geo: global
        unit: 1
        price: '0.00'
        userMultiplied: false
      - label: GitLab Credits included
        name: credits
        type: quota
        metric: USD
        limit: 24
        timeFrame: month
        geo: global
        unit: 1
        price: '0.00'
        userMultiplied: false
    elements:
      - name: Application Security Testing
      - name: Software Supply Chain Security
      - name: Vulnerability Management
      - name: Strategic Portfolio Management
      - name: Value Stream Management
      - name: Compliance + Governance
      - name: Unlimited guest users
